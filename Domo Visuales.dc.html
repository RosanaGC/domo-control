<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#050408;color:#e9e6f0;font-family:'JetBrains Mono',ui-monospace,monospace}
a{color:#9cff8a}a:hover{color:#c58bff}
*{box-sizing:border-box}
</style>
</helmet>
<div style="min-height:100vh;display:flex;flex-wrap:wrap;background:#050408">
  <div ref="{{ stageRef }}" style="flex:1 1 480px;min-width:0;display:grid;place-items:center;padding:24px;background:#000">
    <div style="position:relative;width:min(100%, calc(100vh - 48px));aspect-ratio:1">
      <canvas ref="{{ canvasRef }}" width="2048" height="2048" style="width:100%;height:100%;display:block"></canvas>
      <sc-if value="{{ guide }}" hint-placeholder-val="{{ true }}">
        <div style="position:absolute;inset:0;border-radius:50%;border:1px dashed rgba(233,230,240,0.25);pointer-events:none">
          <div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:10px;letter-spacing:0.2em;color:rgba(233,230,240,0.4)">CENIT</div>
          <div style="position:absolute;left:50%;bottom:10px;transform:translateX(-50%);font-size:10px;letter-spacing:0.2em;color:rgba(233,230,240,0.4)">FRENTE ▼</div>
          <div style="position:absolute;left:25%;top:25%;right:25%;bottom:25%;border-radius:50%;border:1px dashed rgba(233,230,240,0.12)"></div>
        </div>
      </sc-if>
    </div>
  </div>
  <div style="flex:0 1 320px;min-width:260px;padding:28px 24px;display:flex;flex-direction:column;gap:28px;border-left:1px solid #1a1720">
    <div style="display:flex;flex-direction:column;gap:6px">
      <div style="font-size:13px;font-weight:600;letter-spacing:0.08em">VISUALES DOMO</div>
      <div style="font-size:11px;color:#8d879a;line-height:1.5;text-wrap:pretty">Domemaster fisheye 180°. Las partículas estallan con cada golpe de bajo.</div>
    </div>

    <div style="display:flex;flex-direction:column;gap:10px">
      <div style="font-size:10px;letter-spacing:0.15em;color:#8d879a">FUENTE DE AUDIO</div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px">
        <button onClick="{{ useMic }}" style="padding:10px 4px;font:inherit;font-size:11px;color:#e9e6f0;background:{{ bgMic }};border:1px solid #2a2532;border-radius:4px;cursor:pointer">Micrófono</button>
        <button onClick="{{ pickFile }}" style="padding:10px 4px;font:inherit;font-size:11px;color:#e9e6f0;background:{{ bgFile }};border:1px solid #2a2532;border-radius:4px;cursor:pointer">Archivo</button>
        <button onClick="{{ useDemo }}" style="padding:10px 4px;font:inherit;font-size:11px;color:#e9e6f0;background:{{ bgDemo }};border:1px solid #2a2532;border-radius:4px;cursor:pointer">Demo</button>
      </div>
      <input ref="{{ fileRef }}" type="file" accept="audio/*" onChange="{{ onFile }}" style="display:none">
      <audio ref="{{ audioRef }}" controls="" style="width:100%;height:32px;display:{{ audioDisplay }}"></audio>
      <div style="font-size:11px;color:#b9b3c6">{{ status }}</div>
      <div style="display:flex;align-items:center;gap:10px">
        <div style="flex:1;height:6px;background:#1a1720;border-radius:3px;overflow:hidden">
          <div style="height:100%;width:{{ levelPct }};background:#c58bff"></div>
        </div>
        <div style="width:10px;height:10px;border-radius:50%;background:{{ beatColor }}"></div>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:10px">
      <div style="font-size:10px;letter-spacing:0.15em;color:#8d879a">RESOLUCIÓN</div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px">
        <button onClick="{{ res1k }}" style="padding:10px 4px;font:inherit;font-size:11px;color:#e9e6f0;background:{{ bg1k }};border:1px solid #2a2532;border-radius:4px;cursor:pointer">1024</button>
        <button onClick="{{ res2k }}" style="padding:10px 4px;font:inherit;font-size:11px;color:#e9e6f0;background:{{ bg2k }};border:1px solid #2a2532;border-radius:4px;cursor:pointer">2048</button>
        <button onClick="{{ res4k }}" style="padding:10px 4px;font:inherit;font-size:11px;color:#e9e6f0;background:{{ bg4k }};border:1px solid #2a2532;border-radius:4px;cursor:pointer">4096</button>
      </div>
      <div style="font-size:11px;color:#8d879a;line-height:1.5">4096 es lo final para el domo; 1024 para ensayar fluido.</div>
    </div>

    <div style="display:flex;flex-direction:column;gap:10px">
      <div style="font-size:10px;letter-spacing:0.15em;color:#8d879a">GRABAR</div>
      <button onClick="{{ toggleRec }}" style="padding:12px;font:inherit;font-size:12px;font-weight:600;color:#050408;background:{{ recBg }};border:none;border-radius:4px;cursor:pointer">{{ recLabel }}</button>
      <sc-if value="{{ downloadUrl }}" hint-placeholder-val="{{ false }}">
        <a href="{{ downloadUrl }}" download="{{ downloadName }}" style="font-size:12px">Descargar {{ downloadName }}</a>
      </sc-if>
    </div>

    <div style="display:flex;gap:6px;flex-wrap:wrap">
      <button onClick="{{ fullscreen }}" style="flex:1;padding:10px;font:inherit;font-size:11px;color:#e9e6f0;background:transparent;border:1px solid #2a2532;border-radius:4px;cursor:pointer">Pantalla completa</button>
      <button onClick="{{ toggleGuide }}" style="flex:1;padding:10px;font:inherit;font-size:11px;color:#e9e6f0;background:transparent;border:1px solid #2a2532;border-radius:4px;cursor:pointer">{{ guideLabel }}</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;sensitivity&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1.3,&quot;min&quot;:1.05,&quot;max&quot;:2.2,&quot;step&quot;:0.05,&quot;section&quot;:&quot;Audio&quot;,&quot;tsType&quot;:&quot;number&quot;},&quot;demoBpm&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:120,&quot;min&quot;:60,&quot;max&quot;:200,&quot;section&quot;:&quot;Audio&quot;,&quot;tsType&quot;:&quot;number&quot;},&quot;density&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0.2,&quot;max&quot;:2.5,&quot;step&quot;:0.1,&quot;section&quot;:&quot;Visual&quot;,&quot;tsType&quot;:&quot;number&quot;},&quot;trails&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.8,&quot;min&quot;:0,&quot;max&quot;:0.97,&quot;step&quot;:0.01,&quot;section&quot;:&quot;Visual&quot;,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  state = { source: 'demo', status: 'Demo a 120 BPM', res: 2048, recording: false, recTime: 0, downloadUrl: null, guide: true, level: 0, beatOn: false };
  canvasRef = React.createRef(); fileRef = React.createRef(); audioRef = React.createRef(); stageRef = React.createRef();
  parts = []; rings = []; flash = 0; rot = 0; hist = []; lastBeat = 0; demoIdx = 0; frame = 0;
  COLS = ['rgb(197,139,255)', 'rgb(156,255,138)', 'rgb(245,240,255)'];

  componentDidMount() {
    this.S = 2048;
    this.stars = [];
    for (let i = 0; i < 1400; i++) {
      const z = Math.random(), th = Math.acos(z);
      this.stars.push({ th, phi: Math.random() * 6.283, b: 0.2 + Math.random() * 0.8, sp: 0.5 + Math.random() * 2, ph: Math.random() * 6.28, c: Math.random() < 0.12 ? (Math.random() < 0.5 ? 0 : 1) : 2, big: Math.random() < 0.05 });
    }
    this.last = performance.now();
    this.demoNext = this.last + 400;
    const tick = () => { this.step(); this.raf = requestAnimationFrame(tick); };
    this.raf = requestAnimationFrame(tick);
  }
  componentWillUnmount() {
    cancelAnimationFrame(this.raf);
    if (this.micStream) this.micStream.getTracks().forEach(t => t.stop());
    if (this.ac) this.ac.close();
  }

  ensureCtx() {
    if (!this.ac) {
      this.ac = new (window.AudioContext || window.webkitAudioContext)();
      this.an = this.ac.createAnalyser(); this.an.fftSize = 2048; this.an.smoothingTimeConstant = 0.4;
      this.freq = new Uint8Array(this.an.frequencyBinCount);
      this.dest = this.ac.createMediaStreamDestination();
    }
    this.ac.resume();
  }
  disconnectSrc() {
    if (this.curSrc) { try { this.curSrc.disconnect(); } catch (e) {} this.curSrc = null; }
    if (this.micStream) { this.micStream.getTracks().forEach(t => t.stop()); this.micStream = null; }
    const a = this.audioRef.current; if (a && this.state.source === 'file') a.pause();
  }
  async useMic() {
    try {
      this.ensureCtx(); this.disconnectSrc();
      this.micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
      const src = this.ac.createMediaStreamSource(this.micStream);
      src.connect(this.an); src.connect(this.dest); this.curSrc = src; this.hist = [];
      this.setState({ source: 'mic', status: 'Escuchando micrófono' });
    } catch (e) { this.setState({ status: 'No se pudo abrir el micrófono' }); }
  }
  onFile(e) {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    this.ensureCtx(); this.disconnectSrc();
    const a = this.audioRef.current;
    a.src = URL.createObjectURL(f);
    if (!this.elSrc) this.elSrc = this.ac.createMediaElementSource(a);
    this.elSrc.connect(this.an); this.elSrc.connect(this.ac.destination); this.elSrc.connect(this.dest);
    this.curSrc = this.elSrc; this.hist = [];
    a.play();
    this.setState({ source: 'file', status: f.name });
    e.target.value = '';
  }
  useDemo() { this.disconnectSrc(); this.demoNext = performance.now() + 200; this.setState({ source: 'demo', status: 'Demo a ' + this.bpm() + ' BPM' }); }
  bpm() { return this.props.demoBpm ?? 120; }

  setRes(n) {
    if (this.state.recording) return;
    const c = this.canvasRef.current; c.width = c.height = n; this.S = n;
    this.setState({ res: n });
  }

  toggleRec() {
    if (this.state.recording) { this.rec.stop(); return; }
    const c = this.canvasRef.current;
    const stream = c.captureStream(60);
    if (this.dest && this.state.source !== 'demo') this.dest.stream.getAudioTracks().forEach(t => stream.addTrack(t));
    const mime = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm', 'video/mp4'].find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t));
    const chunks = [];
    this.rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: this.S >= 4096 ? 60e6 : this.S >= 2048 ? 25e6 : 10e6 });
    this.rec.ondataavailable = ev => { if (ev.data.size) chunks.push(ev.data); };
    this.rec.onstop = () => {
      const blob = new Blob(chunks, { type: mime });
      if (this.state.downloadUrl) URL.revokeObjectURL(this.state.downloadUrl);
      this.setState({ recording: false, downloadUrl: URL.createObjectURL(blob), downloadName: 'domo-' + this.S + (mime.includes('mp4') ? '.mp4' : '.webm') });
    };
    this.rec.start(1000); this.recStart = performance.now();
    this.setState({ recording: true, downloadUrl: null });
  }
  fullscreen() { const el = this.stageRef.current; if (document.fullscreenElement) document.exitFullscreen(); else if (el.requestFullscreen) el.requestFullscreen(); }

  band(lo, hi) {
    const bin = this.ac.sampleRate / this.an.fftSize;
    const a = Math.max(1, Math.floor(lo / bin)), b = Math.max(a + 1, Math.floor(hi / bin));
    let s = 0; for (let i = a; i < b; i++) s += this.freq[i];
    return s / (b - a) / 255;
  }
  analyze(now) {
    if (this.state.source === 'demo' || !this.an) {
      const iv = 60000 / this.bpm();
      let beat = false, strength = 0;
      if (now >= this.demoNext) {
        beat = true; strength = this.demoIdx % 4 === 0 ? 2.4 : this.demoIdx % 2 === 0 ? 1.7 : 1.35;
        this.demoIdx++; this.lastDemo = now; this.demoNext += iv; if (now > this.demoNext) this.demoNext = now + iv;
      }
      const bass = Math.exp(-(now - (this.lastDemo || 0)) / 160);
      return { bass, mid: 0.3 + 0.2 * Math.sin(now / 2000), high: 0.25 + 0.25 * bass, beat, strength };
    }
    this.an.getByteFrequencyData(this.freq);
    const bass = this.band(30, 150), mid = this.band(300, 2000), high = this.band(4000, 12000);
    const h = this.hist; const avg = h.length ? h.reduce((a, b) => a + b, 0) / h.length : bass;
    h.push(bass); if (h.length > 43) h.shift();
    const sens = this.props.sensitivity ?? 1.3;
    let beat = false, strength = 0;
    if (h.length > 10 && bass > avg * sens && bass > 0.18 && now - this.lastBeat > 200) {
      beat = true; strength = Math.min(3, 1 + (bass / Math.max(avg, 0.01) - 1) * 2.2 + bass);
    }
    return { bass, mid, high, beat, strength };
  }

  basis(o) {
    const a = Math.abs(o[2]) > 0.95 ? [1, 0, 0] : [0, 0, 1];
    let t1 = [o[1] * a[2] - o[2] * a[1], o[2] * a[0] - o[0] * a[2], o[0] * a[1] - o[1] * a[0]];
    const l = Math.hypot(t1[0], t1[1], t1[2]); t1 = [t1[0] / l, t1[1] / l, t1[2] / l];
    const t2 = [o[1] * t1[2] - o[2] * t1[1], o[2] * t1[0] - o[0] * t1[2], o[0] * t1[1] - o[1] * t1[0]];
    return [t1, t2];
  }
  burst(strength, zenith) {
    let o;
    if (zenith) o = [0, 0, 1];
    else { const th = 0.3 + Math.random() * 1.0, ph = Math.random() * 6.283; o = [Math.sin(th) * Math.cos(ph), Math.sin(th) * Math.sin(ph), Math.cos(th)]; }
    const [t1, t2] = this.basis(o);
    const density = this.props.density ?? 1;
    const n = Math.round((140 + 320 * Math.min(1, (strength - 1) / 1.4)) * density * (zenith ? 1.6 : 1));
    const main = Math.random() < 0.5 ? 0 : 1;
    const base = 0.5 + strength * 0.35;
    for (let i = 0; i < n && this.parts.length < 9000; i++) {
      const ang = Math.random() * 6.283, s = (0.25 + Math.pow(Math.random(), 0.6) * 1.1) * base;
      const c = Math.random() < 0.12 ? 2 : Math.random() < 0.18 ? 1 - main : main;
      const life = 0.8 + Math.random() * 1.8;
      this.parts.push({ p: o.slice(), v: [(t1[0] * Math.cos(ang) + t2[0] * Math.sin(ang)) * s, (t1[1] * Math.cos(ang) + t2[1] * Math.sin(ang)) * s, (t1[2] * Math.cos(ang) + t2[2] * Math.sin(ang)) * s], life, max: life, sz: 1 + Math.random() * 2.2, c });
    }
    this.rings.push({ o, t1, t2, a: 0, sp: 0.9 + strength * 0.4, life: 1, c: main });
  }

  step() {
    const c = this.canvasRef.current; if (!c) return;
    const ctx = c.getContext('2d');
    const now = performance.now(), dt = Math.min(0.05, (now - this.last) / 1000); this.last = now;
    const S = this.S, cx = S / 2, cy = S / 2, R = S / 2 * 0.995, k = S / 1024, HP = Math.PI / 2;
    const au = this.analyze(now);
    if (au.beat) {
      this.lastBeat = now;
      this.burst(au.strength, false);
      if (au.strength > 2) { this.burst(au.strength, true); this.flash = Math.min(1, au.strength / 3); }
      else if (au.strength > 1.6) this.burst(au.strength * 0.8, false);
    }
    const trails = this.props.trails ?? 0.8;
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(4,3,8,' + (1 - trails).toFixed(3) + ')'; ctx.fillRect(0, 0, S, S);
    ctx.globalCompositeOperation = 'lighter';

    if (this.flash > 0.01) {
      const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * 0.7);
      g.addColorStop(0, 'rgba(220,200,255,' + (this.flash * 0.35) + ')'); g.addColorStop(1, 'rgba(120,255,140,0)');
      ctx.fillStyle = g; ctx.globalAlpha = 1; ctx.fillRect(0, 0, S, S);
      this.flash *= Math.pow(0.03, dt);
    }

    this.rot += dt * (0.015 + au.mid * 0.12);
    const st = this.stars, tw0 = now * 0.002, hb = 0.55 + au.high * 1.4 + au.bass * 0.4;
    for (let ci = 0; ci < 3; ci++) {
      ctx.fillStyle = this.COLS[ci];
      for (let i = 0; i < st.length; i++) {
        const s = st[i]; if (s.c !== ci) continue;
        const r = s.th / HP * R, ph = s.phi + this.rot;
        const a = s.b * (0.3 + 0.7 * (0.5 + 0.5 * Math.sin(tw0 * s.sp + s.ph))) * hb;
        ctx.globalAlpha = Math.min(1, a * 0.7);
        const z = (s.big ? 2.4 : 1.1) * k;
        ctx.fillRect(cx + r * Math.cos(ph) - z / 2, cy + r * Math.sin(ph) - z / 2, z, z);
      }
    }

    ctx.lineWidth = 1.5 * k;
    for (let i = this.rings.length - 1; i >= 0; i--) {
      const g = this.rings[i];
      g.a += g.sp * dt; g.life -= dt * 0.9;
      if (g.life <= 0) { this.rings.splice(i, 1); continue; }
      ctx.strokeStyle = this.COLS[g.c]; ctx.globalAlpha = g.life * 0.6;
      ctx.beginPath(); let started = false;
      const ca = Math.cos(g.a), sa = Math.sin(g.a);
      for (let j = 0; j <= 72; j++) {
        const t = j / 72 * 6.283, ct = Math.cos(t) * sa, s2 = Math.sin(t) * sa;
        const px = g.o[0] * ca + g.t1[0] * ct + g.t2[0] * s2, py = g.o[1] * ca + g.t1[1] * ct + g.t2[1] * s2, pz = g.o[2] * ca + g.t1[2] * ct + g.t2[2] * s2;
        if (pz < 0) { started = false; continue; }
        const r = Math.acos(Math.min(1, pz)) / HP * R, ph = Math.atan2(py, px);
        const x = cx + r * Math.cos(ph), y = cy + r * Math.sin(ph);
        if (started) ctx.lineTo(x, y); else { ctx.moveTo(x, y); started = true; }
      }
      ctx.stroke();
    }

    const drag = Math.pow(0.3, dt), grav = 0.18 * dt, P = this.parts;
    const buckets = [[], [], []];
    for (let i = P.length - 1; i >= 0; i--) {
      const q = P[i]; q.life -= dt;
      if (q.life <= 0) { P[i] = P[P.length - 1]; P.pop(); continue; }
      const p = q.p, v = q.v;
      v[0] += p[0] * p[2] * grav; v[1] += p[1] * p[2] * grav; v[2] += (p[2] * p[2] - 1) * grav;
      p[0] += v[0] * dt; p[1] += v[1] * dt; p[2] += v[2] * dt;
      const l = Math.hypot(p[0], p[1], p[2]); p[0] /= l; p[1] /= l; p[2] /= l;
      const d = v[0] * p[0] + v[1] * p[1] + v[2] * p[2];
      v[0] = (v[0] - p[0] * d) * drag; v[1] = (v[1] - p[1] * d) * drag; v[2] = (v[2] - p[2] * d) * drag;
      if (p[2] < -0.05) { P[i] = P[P.length - 1]; P.pop(); continue; }
      buckets[q.c].push(q);
    }
    for (let ci = 0; ci < 3; ci++) {
      ctx.fillStyle = this.COLS[ci];
      const B = buckets[ci];
      for (let i = 0; i < B.length; i++) {
        const q = B[i], p = q.p;
        const r = Math.acos(Math.min(1, Math.max(-1, p[2]))) / HP * R, ph = Math.atan2(p[1], p[0]);
        const x = cx + r * Math.cos(ph), y = cy + r * Math.sin(ph);
        const f = q.life / q.max;
        const z = q.sz * k * (0.6 + f * 0.8);
        ctx.globalAlpha = f * 0.9; ctx.fillRect(x - z / 2, y - z / 2, z, z);
        ctx.globalAlpha = f * 0.12; ctx.fillRect(x - z * 1.5, y - z * 1.5, z * 3, z * 3);
      }
    }

    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1; ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.rect(0, 0, S, S); ctx.moveTo(cx + R, cy); ctx.arc(cx, cy, R, 0, Math.PI * 2, true); ctx.fill();

    if (++this.frame % 5 === 0) {
      this.setState({ level: au.bass, beatOn: now - this.lastBeat < 140, recTime: this.state.recording ? (now - this.recStart) / 1000 : 0 });
    }
  }

  renderVals() {
    const s = this.state, on = '#2a2236', off = 'transparent';
    const t = Math.floor(s.recTime), mm = Math.floor(t / 60), ss = String(t % 60).padStart(2, '0');
    return {
      canvasRef: this.canvasRef, fileRef: this.fileRef, audioRef: this.audioRef, stageRef: this.stageRef,
      useMic: () => this.useMic(), pickFile: () => this.fileRef.current && this.fileRef.current.click(), onFile: e => this.onFile(e), useDemo: () => this.useDemo(),
      bgMic: s.source === 'mic' ? on : off, bgFile: s.source === 'file' ? on : off, bgDemo: s.source === 'demo' ? on : off,
      audioDisplay: s.source === 'file' ? 'block' : 'none',
      status: s.status, levelPct: Math.round(Math.min(1, s.level) * 100) + '%', beatColor: s.beatOn ? '#9cff8a' : '#2a2532',
      res1k: () => this.setRes(1024), res2k: () => this.setRes(2048), res4k: () => this.setRes(4096),
      bg1k: s.res === 1024 ? on : off, bg2k: s.res === 2048 ? on : off, bg4k: s.res === 4096 ? on : off,
      toggleRec: () => this.toggleRec(), recBg: s.recording ? '#ff6a6a' : '#9cff8a',
      recLabel: s.recording ? 'Detener · ' + mm + ':' + ss : 'Grabar',
      downloadUrl: s.downloadUrl, downloadName: s.downloadName,
      fullscreen: () => this.fullscreen(), guide: s.guide, toggleGuide: () => this.setState({ guide: !s.guide }), guideLabel: s.guide ? 'Ocultar guía' : 'Mostrar guía'
    };
  }
}
</script>
</body>
</html>
